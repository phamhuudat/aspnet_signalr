name: aspnet_signalr
description: "Pure Dart client for ASP.NET SignalR 2.x: multi-connection, proxy, WebSockets, SSE, Long Polling and auto reconnect."
version: 0.0.1
repository: https://github.com/phamhuudat/aspnet_signalr
issue_tracker: https://github.com/phamhuudat/aspnet_signalr/issues
topics: [signalr, realtime, websocket, sse, aspnet]

environment:
  sdk: ^3.4.0

dependencies:
  http: ^1.2.0
  meta: ^1.12.0
  web: ">=0.5.0 <2.0.0"
  web_socket_channel: ">=2.4.0 <4.0.0"

dev_dependencies:
  lints: ^5.0.0
  mocktail: ^1.0.0
  shelf: ^1.4.0
  shelf_web_socket: ^2.0.0
  test: ^1.25.0
